name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-lkm-hawaiip:
    name: LKM / Moto E22 (hawaiip / android12-4.19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev libelf-dev make python3 zip \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone Motorola kernel-mtk (hawaiip)
        run: |
          git clone --depth=1 \
            -b MMI-STA32.79-13-2 \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            kernel-mtk

      - name: Prepare kernel headers
        run: |
          cd kernel-mtk
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            mt6765_defconfig
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            modules_prepare

      - name: Build dfroot.ko (hawaiip)
        run: |
          cd lkm
          make -j$(nproc) \
            KDIR=$GITHUB_WORKSPACE/kernel-mtk \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-android12-4.19-hawaiip.ko

      - name: Upload dfroot.ko (hawaiip)
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-android12-4.19-hawaiip
          path: out/dfroot-android12-4.19-hawaiip.ko

  build-dfroot:
    needs: [build-lkms, build-lkm-hawaiip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7


      - name: Create signing.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo KEYSTORE_FILE=../keystore.jks > signing.properties
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> signing.properties
            echo "KEY_ALIAS=$KEY_ALIAS" >> signing.properties
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> signing.properties
            echo "$KEYSTORE" | base64 --decode > keystore.jks
          fi

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build DFRoot APK
        run: |
          if [ -f signing.properties ]; then
            ./gradlew :app:assembleRelease
          else
            echo "::notice::No signing secrets found, building debug APK instead."
            ./gradlew :app:assembleDebug
          fi

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v7
        with:
          name: DFRoot
          path: |
            app/build/outputs/apk/release/DFRoot_*.apk
            app/build/outputs/apk/debug/DFRoot_*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/DFRoot_*.apk
